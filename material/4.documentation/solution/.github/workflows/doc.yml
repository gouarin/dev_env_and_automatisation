name: "Build and deploy the documentation"

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    workflow_dispatch:

# One run at a time per branch: a new push cancels the previous run of the same branch
concurrency:
    group: pages-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        # Don't run on forks (replace with your own owner/repository)
        if: github.repository == 'gouarin/splinart-cpp'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: prefix-dev/setup-pixi@v0.11.3
              with:
                  pixi-version: v0.84.1
                  cache: true

            - name: Build splinart Documentation
              run: pixi run doc

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  path: "doc/build/html"

    deploy:
        runs-on: ubuntu-latest
        needs: build
        if: github.repository == 'gouarin/splinart-cpp' && github.ref == 'refs/heads/main'
        permissions:
            contents: read
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
