context:
  version: ${{ env.get("VERSION") }}

package:
  name: splinart-cpp
  version: ${{ version }}

source:
  path: ..

build:
  number: 0

requirements:
  build:
    - ${{ compiler("cxx") }}
    - cmake
    - ninja
  host:
    - xtensor >=0.24,<0.26
    - libopencv
    - cli11

tests:
  - script:
      - splinart-cpp --help

about:
  homepage: https://github.com/gouarin/splinart-cpp
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Generative art with circles and splines
