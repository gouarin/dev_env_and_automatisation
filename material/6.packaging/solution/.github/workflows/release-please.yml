name: "Release"

on: workflow_dispatch

permissions:
    contents: write
    issues: write
    pull-requests: write

jobs:
    release-please:
        runs-on: ubuntu-latest
        steps:
            # A personal access token is needed so that publishing the release
            # triggers the "release" event of the conda workflow.
            - uses: googleapis/release-please-action@v5
              with:
                  token: ${{ secrets.RELEASE_PLEASE }}
