[workspace]
authors = ["Loic Gouarin <loic.gouarin@gmail.com>"]
channels = ["conda-forge"]
description = "Development framework and automation for open source software"
name = "dev-env-and-automatisation"
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]
version = "0.1.0"

[tasks]
preview = "myst start"
build = "myst build --html --strict"

[dependencies]
mystmd = ">=1.12.0,<2"

# Replay of the practical session: see tests/replay
[feature.replay.dependencies]
python = ">=3.14,<3.16"
pytest = ">=9.2.0,<10"
actionlint = ">=1.7.12,<2"
shellcheck = ">=0.11.0,<0.12"

[feature.replay.tasks]
replay = "pytest tests/replay"

[environments]
replay = { features = ["replay"], no-default-feature = true }
